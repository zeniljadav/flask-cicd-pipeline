name: Python Application CI

# Trigger this pipeline every time someone pushes code to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Run the automation on a free hosted Ubuntu machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the code from the repository into the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Step 3: Install all dependencies listed in requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Lint code (Checks for syntax mistakes or bad formatting)
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 5: Run Automated Tests using PyTest
    - name: Run Automated Tests
      run: |
        pytest